name: Bug Report
description: File a bug report
title: "Describe your issue"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Make sure you are using the latest version of the shaderpack.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see! Include steps on how you reproduce this issue as well.
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Minecraft Version
      description: Which version of Minecraft do you have?
      options:
        - 26.3
        - 26.2
        - 26.1
        - 1.21.11
        - 1.21.10
        - 1.21.9
        - 1.21.8
        - 1.21.7
        - 1.21.6
        - 1.21.5
        - 1.21.4
        - 1.21.3
        - 1.21.2
        - 1.21.1
        - 1.21
        - Other
    validations:
      required: true
  - type: input
    id: shader-mod-version
    attributes:
      label: Iris version
      description: You can find your Iris version on the shaderpack selection screen ( OptiFine is not supported).
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Shader settings
      description: Please share your shader config file. You can find this in your shaderpacks folder, it should be called something like photon-main.zip.txt
      render: conf
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output.
      render: text
